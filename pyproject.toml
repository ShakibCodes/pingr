[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pingr"
version = "0.2.0"
description = "A clean, minimal, and ephemeral terminal mesh messaging client."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shakib", email = "shakibonit@gmail.com" }
]
keywords = ["chat", "terminal", "tui", "textual", "websockets", "messaging", "mesh", "pingr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
requires-python = ">=3.8"
dependencies = [
    "textual>=0.80.0",
    "websockets>=11.0"
]

[project.urls]
Homepage = "https://github.com/ShakibCodes/tmsg"
Repository = "https://github.com/ShakibCodes/tmsg"
Issues = "https://github.com/ShakibCodes/tmsg/issues"

[project.scripts]
pingr = "tmsg.main:main"
msg = "tmsg.main:main"

[tool.setuptools.packages.find]
include = ["tmsg*"]